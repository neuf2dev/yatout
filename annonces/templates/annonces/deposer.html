<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Déposer une annonce - Yatout</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800">

    <div class="max-w-[800px] mx-auto bg-white min-h-screen shadow-md p-8">
        
        <!-- EN-TÊTE -->
        <div class="flex items-center justify-between border-b-2 border-[#1e40af] pb-4 mb-8">
            <h1 class="text-[#1e40af] text-2xl font-bold">
                Déposer une annonce
            </h1>
            <a href="{% url 'accueil_annonces' %}" class="text-xs text-blue-700 hover:underline font-bold">
                &laquo; Retour à l'accueil
            </a>
        </div>

        <form method="POST" action="{% url 'deposer_annonce' %}" enctype="multipart/form-data" class="space-y-8">
            {% csrf_token %}

            <!-- SECTION TYPE D'ANNONCE & INFOS PRINCIPALES -->
            <div class="space-y-4">
                <h2 class="text-lg font-bold uppercase text-gray-700 border-l-4 border-[#1e40af] pl-3">Vos informations</h2>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- TYPE D'ANNONCE (OFFRE / DEMANDE) -->
                    <div class="flex flex-col">
                        <label class="text-sm font-semibold mb-1">Type d'annonce *</label>
                        <select name="type_annonce" class="border border-gray-300 p-2.5 rounded bg-white outline-none focus:border-[#1e40af] font-bold text-[#1e40af]">
                            <option value="OFFRE" {% if type_selected == 'OFFRE' %}selected{% endif %}>🟢 OFFRE (Je vends / Je propose)</option>
                            <option value="DEMANDE" {% if type_selected == 'DEMANDE' %}selected{% endif %}>🔵 DEMANDE (Je cherche / Je recherche)</option>
                        </select>
                    </div>

                    <!-- TITRE -->
                    <div class="flex flex-col">
                        <label class="text-sm font-semibold mb-1">Titre de l'annonce *</label>
                        <input type="text" name="titre" required class="border border-gray-300 p-2.5 rounded outline-none focus:border-[#1e40af]" placeholder="Ex: Recherche BMW E36 pour pièces">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- CATÉGORIE -->
                    <div class="flex flex-col">
                        <label class="text-sm font-semibold mb-1">Catégorie *</label>
                        <select name="categorie" required class="border border-gray-300 p-2.5 rounded bg-white outline-none focus:border-[#1e40af]">
                            <option value="">Sélectionnez une catégorie</option>
                            <option value="VEHICULES">Véhicules</option>
                            <option value="IMMOBILIER">Immobilier</option>
                            <option value="AMEUBLEMENT">Ameublement</option>
                            <option value="DIVERS">Divers</option>
                        </select>
                    </div>

                    <!-- PRIX -->
                    <div class="flex flex-col">
                        <label class="text-sm font-semibold mb-1">Prix ou Budget (€) *</label>
                        <input type="number" step="0.01" name="prix" required class="border border-gray-300 p-2.5 rounded outline-none focus:border-[#1e40af]" placeholder="0.00">
                    </div>
                </div>
            </div>

            <!-- DESCRIPTION -->
            <div class="flex flex-col">
                <label class="text-sm font-semibold mb-1">Description détaillée *</label>
                <textarea name="description" rows="5" required class="border border-gray-300 p-2.5 rounded outline-none focus:border-[#1e40af]" placeholder="Décrivez votre objet ou le bien que vous recherchez avec précision..."></textarea>
            </div>

            <!-- PHOTOS -->
            <div class="space-y-4">
                <h2 class="text-lg font-bold uppercase text-gray-700 border-l-4 border-[#1e40af] pl-3">Photos</h2>
                <div class="border-2 border-dashed border-gray-300 p-8 text-center rounded-lg hover:border-[#1e40af] bg-gray-50 transition-colors">
                    <p class="text-gray-600 text-sm italic">Ajoutez une photo explicative ou du produit</p>
                    <input type="file" name="image" class="mt-4 text-sm text-gray-500">
                </div>
            </div>

            <!-- COORDONNÉES -->
            <div class="space-y-4">
                <h2 class="text-lg font-bold uppercase text-gray-700 border-l-4 border-[#1e40af] pl-3">Localisation & Contact</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="flex flex-col">
                        <label class="text-sm font-semibold mb-1">Ville ou Code Postal *</label>
                        <input type="text" name="ville" required class="border border-gray-300 p-2.5 rounded outline-none focus:border-[#1e40af]" placeholder="Ex: Paris 11e">
                    </div>
                    <div class="flex flex-col">
                        <label class="text-sm font-semibold mb-1">Téléphone (Optionnel)</label>
                        <input type="tel" name="telephone" class="border border-gray-300 p-2.5 rounded outline-none focus:border-[#1e40af]" placeholder="06 00 00 00 00">
                    </div>
                </div>
            </div>

            <!-- BOUTON VALIDER -->
            <div class="pt-6 border-t border-gray-200">
                <button type="submit" class="w-full bg-[#1e40af] text-white font-bold py-3.5 rounded-lg shadow-md hover:bg-blue-800 transition-colors uppercase tracking-wider text-sm">
                    Publier mon annonce
                </button>
            </div>
        </form>
    </div>

</body>
</html>
