<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifier l'annonce - Leboncoin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800">

    <div class="max-w-[600px] mx-auto bg-white min-h-screen sm:min-h-0 sm:my-10 shadow-md p-8 sm:rounded-lg">
        <div class="flex justify-between items-center border-b-2 border-orange-500 pb-4 mb-6">
            <h1 class="text-[#f56b2a] text-2xl font-bold">
                Modifier mon annonce
            </h1>
            <a href="{% url 'mes_annonces' %}" class="text-xs text-blue-700 font-bold hover:underline">← Annuler</a>
        </div>

        <form method="POST" enctype="multipart/form-data" class="space-y-4">
            {% csrf_token %}

            <div>
                <label class="block text-sm font-semibold mb-1">Titre de l'annonce</label>
                <input type="text" name="titre" value="{{ annonce.titre }}" required class="w-full border border-gray-300 p-2 rounded outline-none focus:border-orange-500">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold mb-1">Catégorie</label>
                    <select name="categorie" class="w-full border border-gray-300 p-2 rounded outline-none focus:border-orange-500 bg-white">
                        <option value="VEHICULES" {% if annonce.categorie == 'VEHICULES' %}selected{% endif %}>Véhicules</option>
                        <option value="IMMOBILIER" {% if annonce.categorie == 'IMMOBILIER' %}selected{% endif %}>Immobilier</option>
                        <option value="AMEUBLEMENT" {% if annonce.categorie == 'AMEUBLEMENT' %}selected{% endif %}>Ameublement</option>
                        <option value="DIVERS" {% if annonce.categorie == 'DIVERS' %}selected{% endif %}>Divers</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">Prix (€)</label>
                    <input type="number" step="0.01" name="prix" value="{{ annonce.prix }}" required class="w-full border border-gray-300 p-2 rounded outline-none focus:border-orange-500">
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold mb-1">Description</label>
                <textarea name="description" rows="5" required class="w-full border border-gray-300 p-2 rounded outline-none focus:border-orange-500">{{ annonce.description }}</textarea>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold mb-1">Ville</label>
                    <input type="text" name="ville" value="{{ annonce.ville }}" required class="w-full border border-gray-300 p-2 rounded outline-none focus:border-orange-500">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">Téléphone</label>
                    <input type="text" name="telephone" value="{{ annonce.telephone|default:'' }}" class="w-full border border-gray-300 p-2 rounded outline-none focus:border-orange-500">
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold mb-1">Photo de l'annonce</label>
                {% if annonce.image %}
                    <div class="mb-2 flex items-center gap-3">
                        <img src="{{ annonce.image.url }}" class="w-16 h-16 object-cover rounded border">
                        <span class="text-xs text-gray-500">Photo actuelle. Choisissez-en une nouvelle pour la remplacer.</span>
                    </div>
                {% endif %}
                <input type="file" name="image" accept="image/*" class="w-full border border-gray-300 p-2 rounded bg-gray-50 text-sm">
            </div>

            <button type="submit" class="w-full bg-[#f56b2a] text-white font-bold py-3 rounded shadow-md hover:bg-orange-600 transition-colors uppercase tracking-wider mt-6">
                Enregistrer les modifications
            </button>
        </form>
    </div>

</body>
</html>
